name: Build Rebuilt Gentoo ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'branding/**'
      - 'profiles/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-iso:
    name: Build x86_64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Rebuilt Gentoo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            grub2-common \
            qemu-system-x86 \
            mtools \
            rsync \
            curl \
            wget

      - name: Prepare build environment
        run: |
          sudo mkdir -p /opt/rebuilt-gentoo/build
          sudo chown -R "$USER:$USER" /opt/rebuilt-gentoo
          mkdir -p /opt/rebuilt-gentoo/build/{rootfs,iso}

      - name: Build ISO filesystem
        run: bash scripts/build-iso.sh /opt/rebuilt-gentoo/build

      - name: Validate ISO structure
        run: |
          ISO=/opt/rebuilt-gentoo/build/iso/Rebuilt-Gentoo-x86_64.iso
          test -s "$ISO"
          xorriso -indev "$ISO" -report_el_torito plain
          xorriso -indev "$ISO" -find /boot -type f -print
          xorriso -indev "$ISO" -find /live -type f -print

      - name: Smoke test BIOS boot in QEMU
        shell: bash
        run: |
          set +e
          ISO=/opt/rebuilt-gentoo/build/iso/Rebuilt-Gentoo-x86_64.iso
          timeout 30s qemu-system-x86_64 \
            -machine accel=tcg \
            -m 1024 \
            -cdrom "$ISO" \
            -boot d \
            -serial stdio \
            -display none \
            -no-reboot \
            > /tmp/rebuilt-gentoo-qemu.log 2>&1
          rc=$?
          set -e

          echo "QEMU exit code: $rc"
          sed -n '1,240p' /tmp/rebuilt-gentoo-qemu.log

          # A timeout is expected because the live system intentionally keeps
          # running. Any earlier QEMU crash/error is a real build failure.
          if [[ "$rc" -ne 124 ]]; then
            echo "ERROR: QEMU did not reach the expected running-live-system state." >&2
            exit 1
          fi

          grep -Eiq 'Rebuilt Gentoo|Linux version|OpenRC|Gentoo' /tmp/rebuilt-gentoo-qemu.log || {
            echo "ERROR: QEMU log does not show evidence that the ISO booted." >&2
            exit 1
          }

      - name: Generate SHA256 checksum
        run: |
          cd /opt/rebuilt-gentoo/build/iso
          sha256sum Rebuilt-Gentoo-x86_64.iso > Rebuilt-Gentoo-x86_64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-gentoo-x86_64-iso
          path: |
            /opt/rebuilt-gentoo/build/iso/Rebuilt-Gentoo-x86_64.iso
            /opt/rebuilt-gentoo/build/iso/Rebuilt-Gentoo-x86_64.iso.sha256
          if-no-files-found: error
          retention-days: 14
